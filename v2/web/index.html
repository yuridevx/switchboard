<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Switchboard</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Приглашение из ссылки должно пережить «На экран Домой»: приложение с иконки открывается с адреса из манифеста,
      // поэтому манифест запрашивается с приглашением, и службы ставят его в адрес запуска.
      (function () {
        var m = /[#&?]invite=([^&]+)/.exec(location.hash + "&" + location.search.slice(1));
        if (m) document.querySelector("link[rel=manifest]").href = "/manifest.webmanifest?invite=" + m[1];
      })();
    </script>
    <meta name="theme-color" content="#16201d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Switchboard" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
