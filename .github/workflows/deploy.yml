# Выкладка на флот и живая проверка. Сессии с компьютера не выкладывают: на флот идёт только отсюда, по одной выкладке на флот.
# Тестовый флот — каждое слияние в main: на тесте всегда main. Зелёная живая проверка двигает ветку-метку fleet/test.
# Прод — только ручным запуском по слову человека: идёт ровно коммит fleet/test; зелёная проверка двигает fleet/prod.
#   gh workflow run deploy.yml -f fleet=prod
# Что где стоит, видно в git: git log origin/fleet/prod..origin/fleet/test — уйдёт в прод; origin/fleet/test..origin/main — ещё проверяется.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fleet:
        description: флот
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: write

jobs:
  test:
    # ручной запуск теста — тоже только main: выкладок из веток нет
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.fleet == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # очередь на флот одна: вторая выкладка ждёт конца первой; ждёт всегда одна — самая свежая
    concurrency:
      group: fleet-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: keeper/go.mod
          cache-dependency-path: keeper/go.sum
      - run: npm ci
      - name: настройки флота
        env:
          SB2_BASE: ${{ secrets.SB2_TEST_BASE }}
          SB2_PASS: ${{ secrets.SB2_TEST_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/deploy/settings.mjs test ci
      - name: выкладка изменившегося
        run: node tools/deploy/fleet.mjs test ci
      - name: живая проверка
        env:
          SB2_KEY: ${{ vars.SB2_KEY }}
          SB2_MODEL: ${{ vars.SB2_MODEL }}
          SB2_SWITCH: ${{ vars.SB2_SWITCH }}
        run: node tools/fleet/live.mjs test ci devbox wsl
      - name: метка fleet/test
        run: git push origin HEAD:refs/heads/fleet/test

  prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.fleet == 'prod'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: fleet-prod
      cancel-in-progress: false
    env:
      SB2_ENV: prod
    steps:
      # на прод идёт ровно то, что прошло живую проверку на тесте
      - uses: actions/checkout@v4
        with:
          ref: fleet/test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: keeper/go.mod
          cache-dependency-path: keeper/go.sum
      - run: npm ci
      - name: настройки флота
        env:
          SB2_BASE: ${{ secrets.SB2_PROD_BASE }}
          SB2_PASS: ${{ secrets.SB2_PROD_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/deploy/settings.mjs prod ci
      - name: выкладка изменившегося
        run: node tools/deploy/fleet.mjs prod ci
      - name: живая проверка
        env:
          SB2_KEY: ${{ vars.SB2_PROD_KEY }}
          SB2_MODEL: ${{ vars.SB2_PROD_MODEL }}
        run: node tools/fleet/live.mjs prod ci ${{ vars.SB2_PROD_MACHINES }}
      - name: метка fleet/prod
        run: git push origin HEAD:refs/heads/fleet/prod
