# Выкладка на флот. Сессии с компьютера не выкладывают: на флот идёт только отсюда, по одной выкладке на флот.
# Код проверен до слияния — частями и живым списком на флоте в коробке (ci.yml): выкладка от окружения теста не зависит.
# Тестовый флот — каждое слияние в main: на тесте всегда main. Прошедшая выкладка двигает ветку-метку fleet/test;
#   после неё идёт живой список на самом тестовом флоте — с настоящей моделью, аккаунтами и хранилищем. Красный он — находка, метку не держит.
# Прод — только ручным запуском по слову человека: идёт ровно коммит fleet/test; зелёная проверка прода двигает fleet/prod.
#   gh workflow run deploy.yml -f fleet=prod
# Что где стоит, видно в git: git log origin/fleet/prod..origin/fleet/test — уйдёт в прод; origin/fleet/test..origin/main — ещё проверяется.
# Путь у обоих флотов один — одна работа; отличаются только настройки флота и коммит.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fleet:
        description: флот
        type: choice
        options: [test, prod]
        default: test

permissions:
  contents: write

jobs:
  fleet:
    # всегда с main: выкладок из веток нет; слияние — это тест, прод — только ручной запуск
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # очередь на флот одна: вторая выкладка ждёт конца первой; ждёт всегда одна — самая свежая
    concurrency:
      group: fleet-${{ inputs.fleet || 'test' }}
      cancel-in-progress: false
    env:
      FLEET: ${{ inputs.fleet || 'test' }}
      SB2_ENV: ${{ inputs.fleet == 'prod' && 'prod' || '' }}
    steps:
      # на прод идёт ровно то, что выложено на тест
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.fleet == 'prod' && 'fleet/test' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # установленные зависимости — из кэша по package-lock: npm ci только когда он изменился
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            */node_modules
          key: deps-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.deps.outputs.cache-hit != 'true'
      - name: настройки флота
        env:
          SB2_BASE: ${{ inputs.fleet == 'prod' && secrets.SB2_PROD_BASE || secrets.SB2_TEST_BASE }}
          SB2_PASS: ${{ inputs.fleet == 'prod' && secrets.SB2_PROD_PASS || secrets.SB2_TEST_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/deploy/settings.mjs $FLEET ci
      - name: выкладка изменившегося
        run: node tools/deploy/fleet.mjs $FLEET ci
      - name: проверка прода
        if: inputs.fleet == 'prod'
        env:
          SB2_KEY: ${{ vars.SB2_PROD_KEY }}
          SB2_MODEL: ${{ vars.SB2_PROD_MODEL }}
          MACHINES: ${{ vars.SB2_PROD_MACHINES }}
        run: node tools/fleet/live.mjs $FLEET ci $MACHINES
      - name: метка fleet/${{ inputs.fleet || 'test' }}
        # метка — указатель на выложенный коммит: ставится как есть. Раннер берёт один последний коммит, и обычный push
        # прежней метки у себя не находит — отказывает «fetch first»
        run: git push --force origin HEAD:refs/heads/fleet/$FLEET
      # после метки: красный список теста — находка об окружении или о стыке с ним, выкладку и метку он не держит
      - name: окружение — живой список на тестовом флоте
        if: inputs.fleet != 'prod'
        env:
          SB2_KEY: ${{ vars.SB2_KEY }}
          SB2_MODEL: ${{ vars.SB2_MODEL }}
          SB2_SWITCH: ${{ vars.SB2_SWITCH }}
          MACHINES: ${{ vars.SB2_MACHINES }}
        run: node tools/fleet/live.mjs $FLEET ci $MACHINES
