# Проверка на каждый push в PR и в main: правило импортов и весь список tools/test/run.mjs — на Linux и Windows.
# Сессии у себя список не гоняют: main принимает только PR с обеими зелёными работами.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: keeper/go.mod
          cache-dependency-path: keeper/go.sum
      - run: npm ci
      - run: node tools/gate/gate.mjs
      - run: node tools/test/run.mjs
