# Проверка на каждый push в PR и в main: весь список tools/test/run.mjs, каждая часть — своей работой, и живой список на флоте в коробке; все разом.
# Окружения проверке не нужно: ни флота, ни машин, ни ключей, ни аккаунтов — всё поднимается на раннере.
# На Linux идут все части; на Windows — те, чей код зависит от системы: Host и служба машины.
# Сессии у себя список не гоняют: main принимает только PR с зелёной работой «проверка».
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  part:
    name: ${{ matrix.part }} · ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        part: [protocol, platform, services, host, web, tools, keeper]
        include:
          - { os: windows-latest, part: host }
          - { os: windows-latest, part: keeper }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        if: matrix.part == 'keeper'
        with:
          go-version-file: keeper/go.mod
          cache-dependency-path: keeper/go.sum
      # Linux: установленные зависимости — из кэша по package-lock, npm ci только когда он изменился
      - uses: actions/cache@v4
        id: deps
        if: matrix.part != 'keeper' && runner.os == 'Linux'
        with:
          path: |
            node_modules
            */node_modules
          key: deps-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: matrix.part != 'keeper' && runner.os == 'Linux' && steps.deps.outputs.cache-hit != 'true'
      # Windows: только зависимости своей части — распаковка большого кэша там дольше установки
      - run: npm ci --workspace ${{ matrix.part }} --workspace protocol --include-workspace-root
        if: matrix.part != 'keeper' && runner.os == 'Windows'
      - run: node tools/test/run.mjs ${{ matrix.part }}

  # флот в коробке: весь Switchboard на раннере — платформа и службы, страница, две машины с Host и claude, поддельная модель; на нём идёт живой список
  box:
    name: коробка ${{ matrix.shard }}
    # список делится на доли: каждая доля — на своей коробке и своём раннере, проверкам с браузерами не тесно
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # история флота — настоящий ClickHouse: его поднимает раннер службой работы, коробка получает адрес и контейнеров не запускает
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_PASSWORD: box
        ports:
          - 8123:8123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: keeper/go.mod
          cache-dependency-path: keeper/go.sum
      - uses: actions/cache@v4
        id: deps
        with:
          path: |
            node_modules
            */node_modules
          key: deps-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.deps.outputs.cache-hit != 'true'
      - run: node tools/box/box.mjs node tools/fleet/live.mjs box cli m1 m2
        env:
          SB2_BOX_CH: http://default:box@127.0.0.1:8123
          SB2_SHARD: ${{ matrix.shard }}

  # одна обязательная проверка ветки main: зелёная, когда зелёные все части и коробка
  check:
    name: проверка
    needs: [part, box]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.part.result }}" = "success" -a "${{ needs.box.result }}" = "success"
