# Switchboard: гейт импортов, типы и тесты на каждый push в main и PR; Keeper — на Linux и Windows.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: node tools/gate/gate.mjs
      - name: типы
        run: for p in protocol platform services host web; do (cd $p && npx tsc --noEmit); done
      - name: тесты
        run: for p in protocol platform services host web; do (cd $p && npx vitest run); done
      - name: сборка страницы
        run: cd web && VITE_FLEET=origin npx vite build

  keeper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: keeper/go.mod
      - run: go vet ./...
      - run: go test ./...
