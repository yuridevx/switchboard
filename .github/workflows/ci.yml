# Проверка на каждый пуш и PR; из main после зелёных проверок — загрузка версий без выкладки.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: гейт манифестов
        run: npm run gate
      - name: typecheck
        run: npx tsc -p tsconfig.json
      - name: тесты Node (protocol, tools, host)
        run: npx vitest run
      - name: тесты пакетов (Worker-модули, веб)
        run: npm run test --workspaces --if-present

  keeper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: os/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: os/keeper/go.mod
          cache-dependency-path: os/keeper/go.sum
      - run: go vet ./...
      # на Linux — с детектором гонок
      - run: go test -count=1 ${{ runner.os == 'Linux' && '-race' || '' }} ./...
      # keeper заморожен: уязвимость Go или зависимости на его пути роняет сборку — повод пересобрать
      - name: уязвимости
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - name: архив выпуска собран дважды — один хэш
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          a=$(node tools/release/cli.ts release keeper --dry-run | grep -o 'sha256 [0-9a-f]*')
          (cd os/keeper && go clean -cache)
          b=$(node tools/release/cli.ts release keeper --dry-run | grep -o 'sha256 [0-9a-f]*')
          echo "$a · $b"; [ -n "$a" ] && [ "$a" = "$b" ]

  upload:
    # загрузка без выкладки: stable двигают «выпуски» (releases.deploy) по слову человека или агента
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, keeper]
    runs-on: ubuntu-latest
    concurrency:
      group: upload
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: os/keeper/go.mod
          cache-dependency-path: os/keeper/go.sum
      - run: npm ci
      - name: Worker-модули, телефон и пульт — версии с меткой 1.1.<прогон>
        run: node scripts/deploy-workers.mjs --upload 1.1.${{ github.run_number }}
      - name: Host в R2
        run: node tools/release/cli.ts release host 1.1.${{ github.run_number }}
      - name: keeper в R2 — когда поднят его номер
        run: node tools/release/cli.ts release keeper
