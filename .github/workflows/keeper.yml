# Keeper: проверка и загрузка в каталог — только когда тронут он сам или его упаковка; остальное — ci.yml (слово пользователя 4 нояб.).
name: keeper

on:
  push:
    branches: [main]
    paths:
      - os/keeper/**
      - tools/release/**
      - tools/release-cli/**
      - .github/workflows/keeper.yml
  pull_request:
    paths:
      - os/keeper/**
      - tools/release/**
      - tools/release-cli/**
      - .github/workflows/keeper.yml
  workflow_dispatch:
  # раз в неделю: новая уязвимость Go всплывает и без правок keeper
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: keeper-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  keeper:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: os/keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: os/keeper/go.mod
          cache-dependency-path: os/keeper/go.sum
      - run: go vet ./...
      # на Linux — с детектором гонок
      - run: go test -count=1 ${{ runner.os == 'Linux' && '-race' || '' }} ./...
      # keeper заморожен: уязвимость Go или зависимости на его пути роняет сборку — повод пересобрать
      - name: уязвимости
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
      # CLI выпуска — пакет монорепо: формат выпуска и гейт манифестов из workspaces
      - if: runner.os == 'Linux'
        working-directory: .
        run: npm ci
      - name: архив выпуска собран дважды — один хэш
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          a=$(node tools/release-cli/cli.ts release keeper --dry-run | grep -o 'sha256 [0-9a-f]*')
          (cd os/keeper && go clean -cache)
          b=$(node tools/release-cli/cli.ts release keeper --dry-run | grep -o 'sha256 [0-9a-f]*')
          echo "$a · $b"; [ -n "$a" ] && [ "$a" = "$b" ]

  upload:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [keeper]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: upload
      cancel-in-progress: false
    env:
      SWITCHBOARD_PASS: ${{ secrets.SWITCHBOARD_CI_PASS }}
      SWITCHBOARD_RELEASES: https://switchboard-releases.yuridevx1608.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: os/keeper/go.mod
          cache-dependency-path: os/keeper/go.sum
      - run: npm ci
      - name: keeper в каталог — когда поднят его номер
        run: node tools/release-cli/cli.ts release keeper
